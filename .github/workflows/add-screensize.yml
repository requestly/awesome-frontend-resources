name: Insert ScreenSize entry

on:
  push:
    branches:
      - add-screensize
    paths:
      - .github/workflows/add-screensize.yml

permissions:
  contents: write

jobs:
  insert-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-screensize
      - name: Insert ScreenSize line into README.md
        run: |
          python3 <<'PYEOF'
          import sys
          path = 'README.md'
          raw = open(path, 'rb').read().decode('utf-8')
          newline = '\r\n' if '\r\n' in raw else '\n'
          src = raw.replace('\r\n', '\n')
          if 'screensize.net' in src:
              print('ScreenSize entry already present; nothing to do.')
              sys.exit(0)
          anchor = '[Regex101](https://regex101.com/)'
          if src.count(anchor) != 1:
              sys.exit(f"anchor occurs {src.count(anchor)} times, expected exactly 1")
          lines = src.split('\n')
          anchor_idx = next(i for i, l in enumerate(lines) if anchor in l)
          print('anchor line:', repr(lines[anchor_idx]))
          entry = '- [ScreenSize](https://screensize.net) — Instantly check your screen size, viewport, resolution and device pixel ratio while testing responsive designs.'
          lines.insert(anchor_idx + 1, entry)
          open(path, 'w', encoding='utf-8', newline='').write(newline.join(lines))
          print('inserted ScreenSize entry after Regex101')
          PYEOF
      - name: Verify and push
        run: |
          grep -n "screensize.net" README.md
          git config user.name "screensizenet"
          git config user.email "screensizenet@users.noreply.github.com"
          git add README.md
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "Add ScreenSize"
          git push origin HEAD:add-screensize
